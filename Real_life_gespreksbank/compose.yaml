name: gespreksbank

services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_SERVERNAME: db
      DB_USERNAME: gespreksbank
      DB_PASSWORD: gespreksbank_local
      DB_NAME: gespreksbank
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: gespreksbank
      MARIADB_USER: gespreksbank
      MARIADB_PASSWORD: gespreksbank_local
      MARIADB_ROOT_PASSWORD: gespreksbank_root_local
    volumes:
      - database_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  database_data:
